<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description en canonical worden per pagina gezet via het SEO-component (vite-react-ssg Head) -->
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/linkedup-favicon.svg">

    <!-- Open Graph algemeen -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LinkedUp" />
    <meta property="og:locale" content="nl_NL" />

    <!-- Structured data (JSON-LD) voor zoekmachines en AI-crawlers -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "LinkedUp",
      "url": "https://linkedup.online/",
      "logo": "https://linkedup.online/linkedup-logo.svg",
      "description": "LinkedUp is gespecialiseerd in leadgeneratie voor recruitment agencies: het vinden van opdrachtgevers met openstaande vacatures en het sourcen van gekwalificeerde kandidaten.",
      "email": "info@linkedup.online",
      "telephone": "+31850045749",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Meidoornpad 42",
        "postalCode": "9713NP",
        "addressLocality": "Groningen",
        "addressCountry": "NL"
      },
      "areaServed": "Nederland",
      "knowsAbout": [
        "leadgeneratie voor recruitment agencies",
        "werving en selectie",
        "candidate sourcing",
        "recruitment sales",
        "arbeidsmarktcommunicatie"
      ],
      "makesOffer": [
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Leadgeneratie voor recruitment agencies",
            "description": "Actief vinden en benaderen van opdrachtgevers met openstaande vacatures voor recruitment agencies."
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Candidate sourcing",
            "description": "Sourcen van gekwalificeerde kandidaten via LinkedIn, Meta en Google voor recruitment agencies."
          }
        }
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Wat is leadgeneratie voor recruitment agencies?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Leadgeneratie voor recruitment agencies is het actief vinden en benaderen van organisaties met openstaande vacatures (opdrachtgevers) en het sourcen van geschikte kandidaten. LinkedUp doet dit volledig voor recruitment agencies: wij leveren warme leads met hiring managers en gekwalificeerde kandidaten, zodat recruiters zich kunnen focussen op gesprekken en plaatsingen."
          }
        },
        {
          "@type": "Question",
          "name": "Hoe kom ik als recruitment agency aan meer opdrachtgevers?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "De meeste agencies zijn afhankelijk van hun eigen netwerk en koude acquisitie. LinkedUp neemt de commerciële acquisitie over: wij mappen jouw doelmarkt, identificeren hiring managers met actieve vacatures en benaderen hen namens jouw bureau. Zo ontstaat een voorspelbare stroom van gesprekken met potentiële opdrachtgevers."
          }
        },
        {
          "@type": "Question",
          "name": "Wat kost leadgeneratie voor een recruitmentbureau?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "De kosten hangen af van jouw niche, doelmarkt en gewenste volume. LinkedUp werkt met vaste maandafspraken zonder lange contracten. In een gratis strategiesessie van 30 minuten analyseren wij jouw markt en maken we een concreet voorstel op maat, inclusief verwacht aantal leads per maand."
          }
        },
        {
          "@type": "Question",
          "name": "Voor welke recruitment niches werkt LinkedUp?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LinkedUp werkt voor recruitment agencies in vrijwel elke niche, waaronder techniek, zorg, finance, legal, IT en logistiek. Met onze gratis AI-marktscan zie je direct hoeveel openstaande vacatures er op dit moment in jouw niche in Nederland zijn."
          }
        },
        {
          "@type": "Question",
          "name": "Hoe snel levert leadgeneratie resultaat op voor mijn agency?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "De meeste klanten van LinkedUp zien binnen twee tot vier weken de eerste gesprekken met opdrachtgevers ontstaan. Omdat wij zowel de sales (opdrachtgevers) als de sourcing (kandidaten) overnemen, kan jouw team direct aan de slag met warme leads in plaats van koude acquisitie."
          }
        }
      ]
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                yellow: '#FFD200', // The "Think Yellow" signature yellow
                dark: '#111827',   // Deep charcoal/black
                gray: '#F3F4F6',   // Light gray background
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-up': 'slideUp 0.8s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          },
        },
      }
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #ffffff; 
      }
      ::-webkit-scrollbar-thumb {
        background: #e5e7eb; 
        border-radius: 0px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d1d5db; 
      }
      body {
        background-color: #ffffff;
        color: #111827;
        overflow-x: hidden;
      }
      /* Custom selection color to match brand */
      ::selection {
        background-color: #FFD200;
        color: #000000;
      }
    </style>
